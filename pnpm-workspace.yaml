catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@fabdeh/*'
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days
trustLockfile: true
blockExoticSubdeps: true
packages:
  - fixtures/*
allowBuilds:
  esbuild: false
  simple-git-hooks: false
  unrs-resolver: false
overrides:
  '@angular/core': 'catalog:' # to remove once @ngrx/* deps support Angular 22
  conventional-changelog-conventionalcommits: ^9.3.1 # v10 is ESM-only, breaks commitlint's CJS require.resolve
  inquirer: ^12.0.0
  pacote: ^21.5.1 # to remove once @angular/cli and angular-eslint uses pacote >=21.5.1 to avoid DoS vulnerability
catalog:
  '@angular/cli': ^22.0.7
  '@angular/core': ^22.0.7
  '@antfu/install-pkg': ^1.1.0
  '@arethetypeswrong/cli': ^0.18.5
